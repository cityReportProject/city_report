<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 960}}">
class Component extends DCLogic {
  state = { filter: 'all' };

  chipStyle(key) {
    const active = this.state.filter === key;
    const base = {
      height: '32px', borderRadius: '16px', padding: '0 14px',
      display: 'flex', alignItems: 'center', gap: '6px',
      whiteSpace: 'nowrap', cursor: 'pointer', flexShrink: '0',
      fontSize: '13px', fontFamily: '-apple-system, system-ui',
      outline: 'none', boxSizing: 'border-box',
    };
    return active
      ? { ...base, background: '#1A4C8C', color: 'white', fontWeight: '600', border: 'none', boxShadow: '0 2px 8px rgba(26,76,140,.35)' }
      : { ...base, background: 'rgba(255,255,255,.72)', backdropFilter: 'blur(14px) saturate(180%)', WebkitBackdropFilter: 'blur(14px) saturate(180%)', border: '0.5px solid rgba(255,255,255,.85)', boxShadow: '0 1px 8px rgba(0,0,0,.1)', color: '#374151', fontWeight: '500' };
  }

  renderVals() {
    const f = this.state.filter;
    return {
      showHigh: f === 'all' || f === 'high',
      showMed:  f === 'all' || f === 'medium',
      showLow:  f === 'all' || f === 'low',
      chipAll:  this.chipStyle('all'),
      chipHigh: this.chipStyle('high'),
      chipMed:  this.chipStyle('medium'),
      chipLow:  this.chipStyle('low'),
      setAll:  () => this.setState({ filter: 'all' }),
      setHigh: () => this.setState({ filter: 'high' }),
      setMed:  () => this.setState({ filter: 'medium' }),
      setLow:  () => this.setState({ filter: 'low' }),
    };
  }
}
</script>
